[package]
name = "iekf"
version = "0.1.0"
edition = "2024"
authors = ["LeonRein <4107480+LeonRein@users.noreply.github.com>"]
description = "Allocation-free iterated extended Kalman filter for embedded targets"
license = "MIT"
repository = "https://github.com/LeonRein/cad_mouse_mk2_firmware"

[dependencies]
# The only dependency, and only for `sqrtf` in the Cholesky factorisation:
# `core` still has no `f32::sqrt`. Kept deliberately at one so the crate is
# usable from any `no_std` project without dragging a matrix library along.
libm = "0.2"

[features]
default = []
defmt = ["dep:defmt"]

[dependencies.defmt]
version = "1.0"
optional = true
