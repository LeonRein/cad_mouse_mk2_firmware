[package]
edition = "2024"
name = "cad-mouse-mk2-firmware"
version = "0.1.0"
authors = ["Your Name <you@example.com>"]
resolver = "2"

[lib]
name = "cad_mouse_mk2_firmware"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "cad-mouse-mk2-firmware"
path = "src/main.rs"
test = false
bench = false

# Cycle-counts the measurement function on target; see its module docs.
#   cargo run --bin bench_forward
#   cargo run --profile release-fast --bin bench_forward
[[bin]]
name = "bench_forward"
path = "src/bin/bench_forward.rs"
test = false
bench = false

[dependencies]
defmt = "1.0"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-storage = "0.3.1"
cortex-m-rt = "0.7.3"

embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }

cortex-m = { version = "0.7.7" }
embassy-rp = { version = "0.9", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa"] }
embassy-usb = "0.5.1"
static_cell = "2.1.1"
tli493d = { path = "../tli493d", features = ["defmt"] }
embassy-embedded-hal = "0.6.0"
smart-leds = "0.4.0"
libm = "0.2"

# Speed, not size. The estimator has a hard 2 kHz deadline and 'z' suppresses
# exactly the inlining and unrolling a bicubic interpolation depends on, while
# the part has 2 MB of flash and nothing here is close to filling it.
[profile.release]
debug = 2
lto = true
opt-level = 3

[profile.dev]
debug = 2
lto = true
opt-level = 3
