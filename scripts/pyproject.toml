[project]
name = "cadmouse"
version = "0.1.0"
description = "Host-side tooling for the CAD Mouse MK2 magnetic knob"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pyserial>=3.5",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# Scripts only, no importable package to build -- record.py is self-contained
# and the estimator is being rewritten from scratch.
[tool.uv]
package = false
