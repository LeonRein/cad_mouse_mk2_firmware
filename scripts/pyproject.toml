[project]
name = "cadmouse"
version = "0.1.0"
description = "Host-side tooling for the CAD Mouse MK2 magnetic knob"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pyserial>=3.5",
    "matplotlib>=3.9",
    # Host-side only, and deliberately an *oracle* rather than a dependency of
    # the shipped filter: the RP2350 implementation is hand-written, so it
    # needs something independent to be checked against. See cadmouse/filter.py.
    "filterpy>=1.4.5",
    "evdev>=1.9.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# Scripts only, no importable package to build -- record.py is self-contained
# and the estimator is being rewritten from scratch.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs a full calibration fit (tens of seconds)"]
